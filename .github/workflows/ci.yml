name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  doom-binary:
    name: Build vendored doom_ascii
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Ensures scripts/setup.sh still clones + compiles the (GPL) doom_ascii
      # upstream. The wallpaper app needs this binary at runtime; CI just proves
      # the fetch/build path hasn't rotted.
      - name: Run setup.sh
        run: ./scripts/setup.sh

      - name: Verify binary
        run: test -x bin/doom_ascii && file bin/doom_ascii

  wasm:
    name: Build Wasm target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p aa-wasm --release --target wasm32-unknown-unknown

  android:
    name: Android build + emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build aa-ffi native library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble debug APK
        working-directory: shells/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # arm64-v8a system images can't run on the emulator's x86_64 host CPU
      # without hardware-accelerated ARM translation, which isn't available
      # on GitHub-hosted runners; use a google_apis x86_64 image for the
      # smoke test and skip installing the (arm64-only) libaa_ffi.so on it.
      - name: Boot emulator and smoke-test app install/launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install shells/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.builder106.asciiarcade/.PreviewActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.builder106.asciiarcade" || (echo "App did not stay foregrounded" && exit 1)

  ios:
    name: iOS build + simulator smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build AaEngine.xcframework
        run: ./scripts/build-ios.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: shells/ios
        run: xcodegen generate

      - name: Boot iOS Simulator
        run: ./scripts/boot-ios-simulator.sh

      - name: Build for simulator
        working-directory: shells/ios
        run: |
          xcodebuild build \
            -project AsciiArcade.xcodeproj \
            -scheme AsciiArcade \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build

      - name: Install and launch on simulator
        working-directory: shells/ios
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 1 -iname "*.app" | head -1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.builder106.asciiarcade

