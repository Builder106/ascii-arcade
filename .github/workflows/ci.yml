name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  licenses:
    name: Open-source license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  fmt:
    name: Rust format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit

  build-test:
    name: Build & test (macOS)
    needs: [secrets, licenses, fmt, audit]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  coverage:
    name: Core unit coverage
    needs: [secrets, licenses, fmt, audit]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run core tests with coverage
        run: swift test --enable-code-coverage --parallel
      - name: Enforce 100% coverage for deterministic core targets
        run: python3 scripts/check-swift-coverage.py

  doom-binary:
    name: Build vendored doom_ascii
    needs: [secrets, licenses, fmt, audit]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Ensures scripts/setup.sh still clones + compiles the (GPL) doom_ascii
      # upstream. The wallpaper app needs this binary at runtime; CI just proves
      # the fetch/build path hasn't rotted.
      - name: Run setup.sh
        run: ./scripts/setup.sh

      - name: Verify binary
        run: test -x bin/doom_ascii && file bin/doom_ascii

  wasm:
    name: Build Wasm target
    needs: [secrets, licenses, fmt, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo build -p aa-wasm --release --target wasm32-unknown-unknown

  android:
    name: Android build + emulator smoke test
    needs: [secrets, licenses, fmt, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build aa-ffi native library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble debug APK
        working-directory: shells/android
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # arm64-v8a system images can't run on the emulator's x86_64 host CPU
      # without hardware-accelerated ARM translation, which isn't available
      # on GitHub-hosted runners; use a google_apis x86_64 image for the
      # smoke test and skip installing the (arm64-only) libaa_ffi.so on it.
      - name: Boot emulator and smoke-test app install/launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install shells/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.builder106.asciiarcade/.PreviewActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.builder106.asciiarcade" || (echo "App did not stay foregrounded" && exit 1)

  ios:
    name: iOS build + simulator smoke test
    needs: [secrets, licenses, fmt, audit]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build AaEngine.xcframework
        run: ./scripts/build-ios.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: shells/ios
        run: xcodegen generate

      - name: Boot iOS Simulator
        run: ./scripts/boot-ios-simulator.sh

      - name: Build for simulator
        working-directory: shells/ios
        run: |
          xcodebuild build \
            -project AsciiArcade.xcodeproj \
            -scheme AsciiArcade \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build

      - name: Install and launch on simulator
        working-directory: shells/ios
        run: |
          # Wait for simulator to be fully booted
          xcrun simctl bootstatus "$DEVICE_ID" -b

          # Find the .app bundle - xcodebuild with -derivedDataPath puts it in a platform-specific folder
          APP_PATH=$(find build/Build/Products -iname "AsciiArcade.app" -type d | head -1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not find AsciiArcade.app in build/Build/Products"
            echo "Contents of build/Build/Products:"
            find build/Build/Products -type f -name "*.app" 2>/dev/null || echo "No .app files found"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.builder106.asciiarcade

  ios-xtool-macos:
    name: iOS xtool package build (macOS)
    needs: [secrets, licenses, fmt, audit]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Build AaEngine.xcframework
        run: ./scripts/build-ios.sh

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Show tool versions
        run: |
          swift --version
          xtool --version

      - name: Validate SwiftPM manifest
        run: swift package dump-package --package-path shells/ios

      - name: Build with xtool
        working-directory: shells/ios
        run: xtool dev build --configuration release

      - name: Verify xtool app bundle
        working-directory: shells/ios
        run: |
          test -x xtool/AsciiArcade.app/AsciiArcade
          test -f xtool/AsciiArcade.app/AsciiArcade_AsciiArcade.bundle/Shaders.metal
          file xtool/AsciiArcade.app/AsciiArcade

  xtool-xcode-input:
    name: Check Linux xtool SDK input
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          XCODE_XIP_URL: ${{ secrets.ASCII_ARCADE_XTOOL_XIP_URL }}
          XCODE_XIP_SHA256: ${{ secrets.ASCII_ARCADE_XTOOL_XIP_SHA256 }}
        run: |
          if [ -n "$XCODE_XIP_URL" ] && [ -n "$XCODE_XIP_SHA256" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  ios-xtool-linux:
    name: iOS xtool package build (Linux ARM64)
    needs: [secrets, licenses, fmt, audit, xtool-xcode-input]
    if: ${{ needs.xtool-xcode-input.outputs.configured == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SWIFT_VERSION: 6.3.3
      XTOOL_VERSION: 1.17.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates clang curl libfuse2t64 ripgrep

      - name: Install Swiftly and Swift
        run: |
          curl -fL --retry 3 --retry-all-errors \
            "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" \
            -o "$RUNNER_TEMP/swiftly.tar.gz"
          tar -zxf "$RUNNER_TEMP/swiftly.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/swiftly" init --quiet-shell-followup
          source "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install --use "$SWIFT_VERSION"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"
          swift --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Install xtool
        run: |
          curl -fL --retry 3 --retry-all-errors \
            "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool-aarch64.AppImage" \
            -o "$RUNNER_TEMP/xtool"
          chmod +x "$RUNNER_TEMP/xtool"
          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          xtool --version

      - name: Download and verify Xcode XIP
        env:
          XCODE_XIP_URL: ${{ secrets.ASCII_ARCADE_XTOOL_XIP_URL }}
          XCODE_XIP_SHA256: ${{ secrets.ASCII_ARCADE_XTOOL_XIP_SHA256 }}
        run: |
          curl -fL --retry 3 --retry-all-errors \
            "$XCODE_XIP_URL" \
            -o "$RUNNER_TEMP/Xcode.xip"
          echo "$XCODE_XIP_SHA256  $RUNNER_TEMP/Xcode.xip" | sha256sum --check

      - name: Validate SwiftPM manifest
        run: swift package dump-package --package-path shells/ios

      - name: Build with xtool
        env:
          AA_XTOOL_SDK_ROOT: ${{ runner.temp }}/darwin-sdk
          AA_XTOOL_BUILD_ROOT: ${{ runner.temp }}/xtool-build
          AA_XTOOL_XDG_CONFIG_HOME: ${{ runner.temp }}/xtool-config
          XTL_TMPDIR: ${{ runner.temp }}/xtool-tmp
        run: bash ./scripts/build-xtool-ios.sh "$RUNNER_TEMP/Xcode.xip"

      - name: Verify xtool app bundle
        working-directory: shells/ios
        run: |
          test -x xtool/AsciiArcade.app/AsciiArcade
          test -f xtool/AsciiArcade.app/AsciiArcade_AsciiArcade.bundle/Shaders.metal
          file xtool/AsciiArcade.app/AsciiArcade

  # Portable engine crates: test + lint on every OS so the shared core is
  # provably platform-neutral.
  core:
    name: core (${{ matrix.os }})
    needs: [secrets, licenses, fmt, audit]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (engine crates + web shell)
        run: cargo clippy -p aa-core -p aa-render -p aa-doom -p aa-web --all-targets -- -D warnings
      - name: Clippy (web shell, doom feature)
        run: cargo clippy -p aa-web --all-targets --features doom -- -D warnings
      - name: Clippy (CLI — no native deps on macOS/Windows)
        if: matrix.os != 'ubuntu-24.04'
        run: cargo clippy -p aa --all-targets -- -D warnings
      - name: Clippy (CLI, doom feature)
        if: matrix.os != 'ubuntu-24.04'
        run: cargo clippy -p aa --all-targets --features doom -- -D warnings
      - name: Test (engine crates)
        run: cargo test -p aa-core -p aa-render -p aa-doom
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce core Rust crates coverage
        if: matrix.os != 'windows-latest'
        run: cargo llvm-cov --package aa-core --package aa-render --package aa-doom --fail-under-lines 100

      - name: Test (web shell)
        run: cargo test -p aa-web
      - name: Test (web shell, doom feature)
        run: cargo test -p aa-web --features doom
      - name: Test (CLI — no native deps on macOS/Windows)
        if: matrix.os != 'ubuntu-24.04'
        run: cargo test -p aa
      - name: Test (CLI, doom feature)
        if: matrix.os != 'ubuntu-24.04'
        run: cargo test -p aa --features doom
      - name: Build headless example
        run: cargo build -p aa-core --example play
      - name: Build web shell
        run: cargo build -p aa-web
      - name: Build web shell (doom feature)
        run: cargo build -p aa-web --features doom

  # Native wallpaper shells: each builds only on its own OS (Win32 / X11 +
  # Wayland). This is the real gate for the shell code, which can't link on the
  # author's macOS dev machine.
  shells:
    name: shell ${{ matrix.crate }} (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            crate: aa-windows
          - os: ubuntu-24.04
            crate: aa-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux wallpaper deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxcb1-dev
      - name: Build shell
        run: cargo build -p ${{ matrix.crate }}
      - name: Clippy shell
        run: cargo clippy -p ${{ matrix.crate }} -- -D warnings
      - name: Build CLI
        run: cargo build -p aa
      - name: Build CLI (doom feature)
        run: cargo build -p aa --features doom
      - name: Clippy CLI
        run: cargo clippy -p aa -- -D warnings
      - name: Clippy CLI (doom feature)
        run: cargo clippy -p aa --features doom -- -D warnings
      - name: Test CLI
        run: cargo test -p aa
      - name: Test CLI (doom feature)
        run: cargo test -p aa --features doom

  # Build release binaries and upload as downloadable artifacts. Runs on every
  # push to main and on manual dispatch so the Windows .exe is always available
  # for on-device testing without a 35-minute VM build.
  artifacts:
    name: release artifact (${{ matrix.target }})
    needs: [core, shells]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            crate: aa-windows
            binary: aa-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build -p ${{ matrix.crate }} --release
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.crate }}-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          retention-days: 30

  deploy:
    name: Deploy to Vercel
    needs: [build-test, coverage, doom-binary, wasm, android, ios, ios-xtool-macos, ios-xtool-linux, artifacts]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required terminal checks passed
        run: |
          for res in \
            "${{ needs['build-test'].result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs['doom-binary'].result }}" \
            "${{ needs.wasm.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.ios.result }}" \
            "${{ needs['ios-xtool-macos'].result }}" \
            "${{ needs.artifacts.result }}"; do
            if [[ "$res" != "success" ]]; then
              echo "Required CI check failed ($res)"
              exit 1
            fi
          done
          # ios-xtool-linux is conditional (skipped if secrets not present)
          if [[ "${{ needs['ios-xtool-linux'].result }}" != "success" && "${{ needs['ios-xtool-linux'].result }}" != "skipped" ]]; then
            echo "ios-xtool-linux failed (${{ needs['ios-xtool-linux'].result }})"
            exit 1
          fi
          echo "All required terminal CI checks passed"
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to production..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying to staging..."
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          fi
