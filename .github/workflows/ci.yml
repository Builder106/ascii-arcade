name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_NOTIFY_USER_LIST: ""

  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  doom-binary:
    name: Build vendored doom_ascii
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Ensures scripts/setup.sh still clones + compiles the (GPL) doom_ascii
      # upstream. The wallpaper app needs this binary at runtime; CI just proves
      # the fetch/build path hasn't rotted.
      - name: Run setup.sh
        run: ./scripts/setup.sh

      - name: Verify binary
        run: test -x bin/doom_ascii && file bin/doom_ascii

  wasm:
    name: Build Wasm target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p aa-wasm --release --target wasm32-unknown-unknown

