name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'crates/aa-core/**', 'crates/aa-wasm/**', 'scripts/build-wasm.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

# REQUIRED: Repository must have Pages enabled in Settings → Pages → Build and deployment → Source: "GitHub Actions"
# If this workflow fails with "Not Found" from configure-pages, enable Pages in the repo settings first.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bash scripts/build-wasm.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
