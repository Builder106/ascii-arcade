name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          X.Y.Z to (re-)publish. Only needed when re-running a failed leg
          without re-tagging — pick the vX.Y.Z tag as "Use workflow from",
          then optionally set this too as a double-check that they match.
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOOM_ASCII_COMMIT: 940528f138e12431e5a1417351863709f1620078

jobs:
  # Resolves and validates the version/tag for this run before anything else
  # starts, and fails fast on anything malformed or ambiguous. Kept out of
  # `verify` deliberately: `verify` is matrixed, and a matrix job's outputs
  # are whichever leg happens to set them last, not a defined value.
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ -n "$INPUT_VERSION" && "v$INPUT_VERSION" != "$TAG" ]]; then
              echo "::error::inputs.version (v$INPUT_VERSION) doesn't match the tag this run is on ($TAG)."
              exit 1
            fi
          elif [[ -n "$INPUT_VERSION" ]]; then
            TAG="v$INPUT_VERSION"
          else
            echo "::error::Not run from a tag push and no 'version' input given. Re-dispatch with 'Use workflow from' set to the vX.Y.Z tag, or supply 'version'."
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not semver X.Y.Z"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG doesn't exist on origin. Run scripts/cut-release.sh first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Re-runs the test suite against the exact tagged commit. Tag pushes don't
  # trigger ci.yml/rust.yml (those only watch branches), so without this, a
  # release would only ever be as verified as "main happened to be green
  # whenever this commit last landed" — matrixed across all three OSes so
  # the Linux/Windows shell code is actually tested, not just compile-checked
  # by the packaging build below.
  verify:
    name: Verify (${{ matrix.os }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux wallpaper deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxcb1-dev
      - name: Check Linux desktop controller
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils libglib2.0-bin
          shellcheck shells/linux/desktop.sh shells/linux/install-desktop.sh
          python3 scripts/test-desktop-launcher.py
          node --input-type=module --check < shells/linux/gnome/extension.js
      - name: Construct Windows desktop controller
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./shells/windows/desktop.ps1 -SmokeTest
      - name: Swift build + test
        if: matrix.os == 'macos-15'
        run: |
          swift build
          swift test
      - name: Rust test (workspace, excluding out-of-scope aa-ffi)
        run: cargo test --workspace --exclude aa-ffi
      - name: Rust test (aa, doom feature)
        run: cargo test -p aa --features doom
      - name: Rust test (aa-web, doom feature)
        run: cargo test -p aa-web --features doom

  doom-source:
    name: Package DOOM source
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: actions/checkout@v7
        with:
          repository: wojciech-graj/doom-ascii
          ref: ${{ env.DOOM_ASCII_COMMIT }}
          path: doom-ascii-source
          persist-credentials: false
      - name: Package matching GPL source
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist-release
          ./scripts/package-doom-source.sh doom-ascii-source "$VERSION" \
            "dist-release/doom-ascii-v${VERSION}-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-doom-source
          path: dist-release/doom-ascii-v*-source.tar.gz
          retention-days: 1

  release-macos:
    name: Package macOS
    needs: [resolve-version, verify, doom-source]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: release-doom-source
          path: doom-source
      - name: Extract matching DOOM source
        run: |
          mkdir -p doom-ascii-source
          tar -xzf "doom-source/doom-ascii-v${{ needs.resolve-version.outputs.version }}-source.tar.gz" \
            -C doom-ascii-source ./doom-ascii
      # macos-15 runners are Apple Silicon; UNIVERSAL=1 makes the .app an
      # arm64+x86_64 binary so it still runs on Intel Macs (macOS 13+ floor).
      - name: Build universal doom_ascii
        env:
          DOOM_ASCII_SOURCE_DIR: ${{ github.workspace }}/doom-ascii-source/doom-ascii
          DOOM_ASCII_CFLAGS: -O2 -w -arch arm64 -arch x86_64
        run: ./scripts/setup.sh
      - name: Build .app + DMG (universal, with DOOM)
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          UNIVERSAL: "1"
          INCLUDE_DOOM: "1"
          DOOM_SOURCE_ARCHIVE: ${{ github.workspace }}/doom-source/doom-ascii-v${{ needs.resolve-version.outputs.version }}-source.tar.gz
        run: |
          ./scripts/make-app.sh
          test -x "dist/ASCII Arcade.app/Contents/Resources/doom_ascii"
          lipo "dist/ASCII Arcade.app/Contents/Resources/doom_ascii" -verify_arch arm64 x86_64
          ./scripts/make-dmg.sh
      - name: Build aa CLI (universal)
        run: |
          cargo build -p aa --release --target x86_64-apple-darwin
          cargo build -p aa --release --target aarch64-apple-darwin
          lipo -create -output aa \
            target/x86_64-apple-darwin/release/aa \
            target/aarch64-apple-darwin/release/aa
      # Also published under a stable, unversioned filename so the site's
      # Download button can link straight to the DMG via GitHub's
      # /releases/latest/download/<name> redirect instead of the releases
      # page — a versioned-only filename would break that link every
      # release.
      - name: Stage release assets
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist-release
          cp "dist/ASCII-Arcade.dmg" "dist-release/ASCII-Arcade-v${VERSION}.dmg"
          cp "dist/ASCII-Arcade.dmg" "dist-release/ASCII-Arcade.dmg"
          mkdir -p aa-package/bin aa-package/wad aa-package/LICENSES
          cp aa aa-package/aa
          cp bin/doom_ascii aa-package/bin/doom_ascii
          cp wad/*.wad aa-package/wad/
          cp "doom-source/doom-ascii-v${VERSION}-source.tar.gz" aa-package/
          cp LICENSES/doom-ascii.GPL-2.0 aa-package/LICENSES/
          tar -C aa-package -czf "dist-release/aa-v${VERSION}-macos.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist-release/*
          retention-days: 1

  release-windows:
    name: Package Windows
    needs: [resolve-version, verify, doom-source]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: release-doom-source
          path: doom-source
      - name: Extract matching DOOM source
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p doom-ascii-source
          tar -xzf "doom-source/doom-ascii-v${VERSION}-source.tar.gz" -C doom-ascii-source ./doom-ascii
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows DOOM engine
        shell: msys2 {0}
        run: |
          DOOM_ASCII_SOURCE_DIR="$PWD/doom-ascii-source" \
          DOOM_ASCII_PLATFORM=win64 \
          DOOM_ASCII_CC=x86_64-w64-mingw32-gcc \
          DOOM_ASCII_OUTPUT_NAME=doom_ascii.exe \
          DOOM_ASCII_LDFLAGS='-static -static-libgcc' \
            ./scripts/setup.sh
          test -s bin/doom_ascii.exe
      - run: cargo build -p aa-windows --release
      - run: cargo build -p aa --release
      - name: Stage release assets
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist-release
          cp target/release/aa-windows.exe "dist-release/ASCII-Arcade-v${VERSION}-windows.exe"
          cp target/release/aa.exe "dist-release/aa-v${VERSION}-windows.exe"
      - name: Package Windows desktop controller
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path desktop-package
          New-Item -ItemType Directory -Path aa-package, aa-package/bin, aa-package/wad, aa-package/LICENSES
          Copy-Item target/release/aa-windows.exe desktop-package/
          Copy-Item target/release/aa.exe aa-package/aa.exe
          Copy-Item bin/doom_ascii.exe aa-package/bin/
          Copy-Item wad/*.wad aa-package/wad/
          Copy-Item "doom-source/doom-ascii-v$env:VERSION-source.tar.gz" aa-package/doom-ascii-source.tar.gz
          Copy-Item LICENSES/doom-ascii.GPL-2.0 aa-package/LICENSES/
          Compress-Archive -Path aa-package/* -DestinationPath "dist-release/aa-v$env:VERSION-windows.zip"
          Copy-Item shells/windows/desktop.ps1, shells/windows/ASCII-Arcade.cmd desktop-package/
          Copy-Item README.md, LICENSE desktop-package/
          New-Item -ItemType Directory -Path desktop-package/bin, desktop-package/wad, desktop-package/LICENSES
          Copy-Item bin/doom_ascii.exe desktop-package/bin/
          Copy-Item wad/*.wad desktop-package/wad/
          Copy-Item "doom-source/doom-ascii-v$env:VERSION-source.tar.gz" desktop-package/doom-ascii-source.tar.gz
          Copy-Item LICENSES/doom-ascii.GPL-2.0 desktop-package/LICENSES/
          Compress-Archive -Path desktop-package/* -DestinationPath "dist-release/ASCII-Arcade-v$env:VERSION-windows-desktop.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist-release/*
          retention-days: 1

  release-linux:
    name: Package Linux
    needs: [resolve-version, verify, doom-source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: release-doom-source
          path: doom-source
      - name: Extract matching DOOM source
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p doom-ascii-source
          tar -xzf "doom-source/doom-ascii-v${VERSION}-source.tar.gz" -C doom-ascii-source ./doom-ascii
      - name: Install Linux wallpaper deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxcb1-dev
      - name: Build Linux DOOM engine
        env:
          DOOM_ASCII_SOURCE_DIR: ${{ github.workspace }}/doom-ascii-source/doom-ascii
          DOOM_ASCII_CFLAGS: -O2 -w
        run: ./scripts/setup.sh
      - run: cargo build -p aa-linux --release
      - run: cargo build -p aa --release
      - name: Stage release assets
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist-release aa-package/bin aa-package/wad aa-package/LICENSES
          mkdir -p shell-package/bin shell-package/wad shell-package/LICENSES
          cp target/release/aa aa-package/aa
          cp bin/doom_ascii aa-package/bin/doom_ascii
          cp wad/*.wad aa-package/wad/
          cp "doom-source/doom-ascii-v${VERSION}-source.tar.gz" aa-package/
          cp LICENSES/doom-ascii.GPL-2.0 aa-package/LICENSES/
          tar -C aa-package -czf "dist-release/aa-v${VERSION}-linux.tar.gz" .
          cp target/release/aa-linux shell-package/aa-linux
          cp bin/doom_ascii shell-package/bin/doom_ascii
          cp wad/*.wad shell-package/wad/
          cp "doom-source/doom-ascii-v${VERSION}-source.tar.gz" shell-package/
          cp LICENSES/doom-ascii.GPL-2.0 shell-package/LICENSES/
          tar -C shell-package -czf "dist-release/ASCII-Arcade-v${VERSION}-linux.tar.gz" .
          mkdir -p desktop-package/bin desktop-package/wad desktop-package/LICENSES
          cp target/release/aa-linux desktop-package/
          cp bin/doom_ascii desktop-package/bin/doom_ascii
          cp wad/*.wad desktop-package/wad/
          cp "doom-source/doom-ascii-v${VERSION}-source.tar.gz" desktop-package/
          cp LICENSES/doom-ascii.GPL-2.0 desktop-package/LICENSES/
          cp shells/linux/desktop.sh shells/linux/install-desktop.sh desktop-package/
          cp -R shells/linux/gnome desktop-package/gnome
          cp assets/icon-512.png desktop-package/icon.png
          cp README.md LICENSE desktop-package/
          chmod +x desktop-package/aa-linux desktop-package/*.sh
          tar -C desktop-package -czf "dist-release/ASCII-Arcade-v${VERSION}-linux-desktop.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist-release/*
          retention-days: 1

  # Gathers all three platforms' assets and publishes exactly one GitHub
  # Release, atomically, rather than each packaging job creating/appending
  # piecemeal. Idempotent: re-dispatching against the same tag after a
  # partial failure uploads (with --clobber) instead of erroring on
  # "release already exists".
  publish:
    name: Publish release
    needs: [resolve-version, release-macos, release-windows, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "release-*"
          path: dist-release
          merge-multiple: true
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets (re-run)."
            gh release upload "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
