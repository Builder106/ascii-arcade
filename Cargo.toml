[workspace]
resolver = "2"
members = [
    "crates/aa-core",
    "crates/aa-render",
    "crates/aa-doom",
    "crates/aa-ffi",
    "crates/aa-wasm",
    "shells/windows",
    "shells/linux",
    "shells/web",
    "shells/cli",
]

# Shared metadata for every crate in the cross-platform Rust port. The macOS
# wallpaper shell remains Swift/AppKit and consumes aa-core via a C ABI; the
# Windows (WorkerW) and Linux (X11 + wlr-layer-shell) shells are native Rust.
# The native iOS (shells/ios) and Android (shells/android) shells also link
# aa-ffi as a native library (.a on iOS, .so on Android) — see crates/aa-ffi.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
repository = "https://github.com/Builder106/ascii-arcade"

[workspace.dependencies]
aa-core = { path = "crates/aa-core" }
aa-render = { path = "crates/aa-render" }
aa-doom = { path = "crates/aa-doom" }
aa-linux = { path = "shells/linux" }
aa-windows = { path = "shells/windows" }

[profile.release]
opt-level = 3
# Fat LTO + a single codegen unit: this binary idles as a 24/7 background
# wallpaper renderer, so a slower release build is worth the smaller, more
# optimized per-frame hot path (over thin LTO's faster-but-looser codegen).
lto = "fat"
codegen-units = 1
