<!doctype html>

<title>ASCII Arcade scene rendering</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --edge: #59636e; --box: #8c959f; --group: #d1d9e0; --groupfill: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --edge: #9198a1; --box: #656c76; --group: #3d444d; --groupfill: #151b23; --accent: #4493f8; } }
html, body { margin: 0; background: var(--bg); }
main { max-width: 720px; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; }
text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.muted { fill: var(--muted); }
.accent-text { fill: var(--accent); }
.bg, .halo { fill: var(--bg); }
.node { fill: var(--bg); stroke-width: 1.25; }
.node.box { stroke: var(--box); }
.node.accent { stroke: var(--accent); stroke-width: 2; }
.group { fill: var(--groupfill); stroke: var(--group); }
.boundary { fill: none; stroke: var(--box); stroke-dasharray: 6 6; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.accent { stroke: var(--accent); stroke-width: 2; }
.edge.dashed { stroke-dasharray: 6 5; }
.lifeline { fill: none; stroke: var(--group); stroke-dasharray: 4 5; }
.tip { fill: var(--edge); }
.tip-accent { fill: var(--accent); }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">ASCII Arcade scene rendering</title>
<desc id="diagram-desc">In the Mac app, the menu bar picks a scene and a theme. SceneView asks the selected AsciiScene for a frame on every tick. Computed scenes such as the donut, helix, and pipes build each frame from math. DOOM runs doom_ascii in a pseudo-terminal and rebuilds frames from its ANSI output in a screen buffer. While DOOM is on screen, global key capture sends keystrokes to it.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 Z"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip-accent" d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<rect class="bg" width="720" height="286"/>
<rect class="group" x="486" y="16" width="232" height="254" rx="8"/>
<text x="500" y="40" font-size="14" class="muted" font-weight="600">Scenes (AsciiScene)</text>
<rect class="node box" x="16" y="16" width="170" height="67" rx="6"/>
<text x="30" y="43" font-size="16" font-weight="600">Menu bar</text>
<text x="30" y="64" font-size="14" class="muted">scene and theme</text>
<rect class="node box" x="246" y="16" width="200" height="67" rx="6"/>
<text x="260" y="43" font-size="16" class="mono" font-weight="600">SceneView</text>
<text x="260" y="64" font-size="14" class="muted">draws each frame</text>
<rect class="node box" x="502" y="52" width="200" height="88" rx="6"/>
<text x="516" y="79" font-size="16" font-weight="600">Computed scenes</text>
<text x="516" y="100" font-size="14" class="muted">donut, helix, pipes</text>
<text x="516" y="121" font-size="14" class="muted mono">frame(atTime:)</text>
<rect class="node box" x="502" y="166" width="200" height="88" rx="6"/>
<text x="516" y="193" font-size="16" font-weight="600">DOOM</text>
<text x="516" y="214" font-size="14" class="muted">doom_ascii in a PTY</text>
<text x="516" y="235" font-size="14" class="muted">ANSI to screen buffer</text>
<rect class="node box" x="246" y="198.5" width="200" height="67" rx="6"/>
<text x="260" y="225.5" font-size="16" font-weight="600">Keyboard</text>
<text x="260" y="246.5" font-size="14" class="muted">while DOOM is up</text>
<path class="edge" d="M186,49.5 L246,49.5" marker-end="url(#arrow)"/>
<rect class="halo" x="192.4" y="28.5" width="47.2" height="19"/>
<text x="216" y="41.5" font-size="14" class="label" text-anchor="middle">picks</text>
<path class="edge" d="M446,49.5 L474,49.5 L474,96 L502,96" marker-end="url(#arrow)"/>
<path class="edge" d="M446,49.5 L474,49.5 L474,210 L502,210" marker-end="url(#arrow)"/>
<path class="edge" d="M446,232 L502,232" marker-end="url(#arrow)"/>
<rect class="halo" x="454.32" y="211" width="39.36" height="19"/>
<text x="474" y="224" font-size="14" class="label" text-anchor="middle">keys</text>
</svg>
</main>
