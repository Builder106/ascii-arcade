<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ASCII Arcade">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <radialGradient id="rring" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#b8ffd0"/>
      <stop offset="55%"  stop-color="#33ff66"/>
      <stop offset="100%" stop-color="#1ab344"/>
    </radialGradient>
    <radialGradient id="rdot" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#e0fff0"/>
      <stop offset="100%" stop-color="#2ff05f"/>
    </radialGradient>
  </defs>

  <!-- Deep phosphor background -->
  <rect width="64" height="64" rx="14" fill="#05090505"/>
  <rect width="64" height="64" rx="14" fill="#060c06"/>

  <!-- Ambient bloom — gives the dark background a subtle green warmth -->
  <circle cx="32" cy="32" r="26" fill="#33ff66" opacity="0.18" filter="url(#bloom)"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="19.5" fill="none"
          stroke="url(#rring)" stroke-width="6"
          filter="url(#glow)"/>

  <!-- Inner dot -->
  <circle cx="32" cy="32" r="6.5" fill="url(#rdot)" filter="url(#glow)"/>

  <!-- Specular highlight on inner dot -->
  <ellipse cx="30.5" cy="30" rx="2.4" ry="1.7" fill="white" opacity="0.5"/>
</svg>
