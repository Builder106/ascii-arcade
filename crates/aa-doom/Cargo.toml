[package]
name = "aa-doom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DOOM driver: spawns doom_ascii over a portable PTY, parses ANSI into Frames."

[dependencies]
aa-core = { workspace = true }
# portable-pty wraps ConPTY (Windows) and forkpty (macOS/Linux) behind one API,
# replacing the Darwin-only PTYBridge — the single change that makes
# DOOM-on-Windows possible.
portable-pty = "0.9"
