[package]
name = "aa-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for aa-core — static lib consumed by the native iOS shell, cdylib consumed by the native Android shell."

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
aa-core = { workspace = true }

# JNI bindings for the Android cdylib target only.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
