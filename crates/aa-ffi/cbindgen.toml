language = "C"
cpp_compat = true
header = "/* Generated by cbindgen — do not hand-edit.\n * Source: crates/aa-ffi/src/lib.rs. Regenerate via scripts/build-ios.sh\n * (or `cbindgen --config crates/aa-ffi/cbindgen.toml --crate aa-ffi --output crates/aa-ffi/aa_engine.h`). */"
include_guard = "AA_ENGINE_H"
include_version = false
autogen_warning = ""
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[parse]
parse_deps = false

[export]
prefix = ""

[fn]
args = "auto"
