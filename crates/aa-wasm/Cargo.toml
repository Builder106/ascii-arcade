[package]
name = "aa-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen wrapper over aa-core for the marketing site."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aa-core = { workspace = true }
# Pinned exactly: wasm-bindgen refuses to run if the CLI's version differs from
# the crate's, and scripts/build-wasm.sh installs the CLI at this same version.
wasm-bindgen = "=0.2.126"
