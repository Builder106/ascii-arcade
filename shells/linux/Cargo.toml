[package]
name = "aa-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux wallpaper shell: X11 root-pixmap and wlr-layer-shell background surface."

[lib]
crate-type = ["rlib"]

[features]
# Both backends are built by default (CI's ubuntu runner has libxkbcommon for
# the Wayland crates). The split lets a developer on a host without the Wayland
# system libraries — notably macOS, where `smithay-client-toolkit`'s build
# script can't run `pkg-config` for xkbcommon — still type-check the pure-Rust
# X11 backend with `--no-default-features --features x11`.
default = ["wayland", "x11"]
x11 = ["dep:x11rb"]
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client"]

[dependencies]
aa-core = { workspace = true }
aa-render = { workspace = true }

# Linux only — absent elsewhere so `cargo check` passes on macOS/Windows. X11
# root-window painting and the Wayland wlr-layer-shell backend live behind
# `#[cfg(target_os = "linux")]`.
#
# x11rb is pure Rust (the default `RustConnection`, no libxcb), so the X11
# backend cross-compiles from any host. The Wayland crates link libwayland and
# need libxkbcommon at build time.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"], optional = true }
smithay-client-toolkit = { version = "0.19", optional = true }
wayland-client = { version = "0.31", optional = true }
