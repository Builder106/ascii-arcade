[package]
name = "aa-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows wallpaper shell: hosts aa-render output in a WorkerW window behind the desktop icons."

[lib]
crate-type = ["rlib"]

[dependencies]
aa-core = { workspace = true }
aa-render = { workspace = true }

# Win32 only — absent off-Windows so `cargo check` passes on macOS/Linux. The
# WorkerW reparenting + Direct2D blit live behind `#[cfg(windows)]`.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
