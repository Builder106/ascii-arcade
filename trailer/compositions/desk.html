<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk</title>
  </head>
  <body>
    <template>
      <style>
        /* A Mac desktop laid over the wall footage: the menu bar, two
           windows, and the ◎ menu that switches the scene under them. */
        #root {
          position: absolute;
          inset: 0;
        }
        .menubar {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 36px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 22px;
          background: rgba(16, 18, 17, 0.62);
          backdrop-filter: blur(18px);
          color: #f2f4f3;
          font: 400 17px/1 "IBM Plex Mono", monospace;
          z-index: 4;
        }
        .menubar b {
          font-weight: 600;
        }
        .menubar .extra {
          margin-left: auto;
          font-size: 20px;
          color: #30d158;
        }
        .window {
          position: absolute;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.14);
          border-radius: 14px;
          background: rgba(14, 16, 15, 0.86);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
          color: #d8dfdb;
          opacity: 0;
        }
        .titlebar {
          display: flex;
          align-items: center;
          gap: 9px;
          height: 40px;
          padding: 0 16px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          font: 400 15px/1 "IBM Plex Mono", monospace;
          color: #9aa49f;
        }
        .titlebar i {
          width: 13px;
          height: 13px;
          border: 1px solid #5d6661;
          border-radius: 50%;
        }
        .titlebar span {
          margin-left: 14px;
        }
        pre {
          margin: 0;
          padding: 22px 26px;
          font: 400 19px/1.55 "IBM Plex Mono", monospace;
        }
        pre b {
          font-weight: 600;
          color: #8fd6a2;
        }
        .editor {
          left: 150px;
          top: 150px;
          width: 860px;
          height: 520px;
        }
        .terminal {
          left: 1100px;
          top: 300px;
          width: 620px;
          height: 470px;
        }
        .menu {
          position: absolute;
          top: 40px;
          right: 18px;
          width: 370px;
          margin: 0;
          padding: 8px;
          list-style: none;
          border: 1px solid rgba(255, 255, 255, 0.14);
          border-radius: 12px;
          background: rgba(22, 24, 23, 0.9);
          backdrop-filter: blur(18px);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
          color: #eef2f0;
          font: 400 18px/1 "IBM Plex Mono", monospace;
          opacity: 0;
          z-index: 5;
        }
        .menu li {
          position: relative;
          display: flex;
          align-items: center;
          height: 32px;
          padding: 0 14px 0 38px;
        }
        /* Section titles are disabled items, so macOS greys them. */
        .menu .head {
          color: #8a938e;
        }
        .menu .hl {
          position: absolute;
          left: 8px;
          right: 8px;
          top: 8px;
          height: 32px;
          padding: 0;
          border-radius: 7px;
          background: #1f8a3a;
          opacity: 0;
        }
        .menu .rule {
          height: 1px;
          margin: 5px 10px;
          padding: 0;
          background: rgba(255, 255, 255, 0.14);
        }
        .check {
          position: absolute;
          left: 13px;
          font-style: normal;
        }
        .check-life {
          opacity: 0;
        }
        .more {
          margin-left: auto;
          font-style: normal;
          color: #9aa49f;
        }
        .cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 38px;
          height: 38px;
          z-index: 6;
          opacity: 0;
        }
        .cursor path {
          fill: #fff;
          stroke: #000;
          stroke-width: 1.4;
          stroke-linejoin: round;
        }
      </style>

      <div id="root" data-composition-id="desk" data-width="1920" data-height="1080">
        <div class="menubar">
          <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
          <span class="extra">◎</span><span class="clock">Sun 18 Oct 10:41</span>
        </div>
        <div class="window editor">
          <div class="titlebar"><i></i><i></i><i></i><span>donut.rs</span></div>
          <pre><code><b>fn</b> frame(&amp;<b>mut</b> self, t: f64) -&gt; Frame {
    <b>let</b> (w, h) = (self.width, self.height);
    <b>let mut</b> zbuf = vec![0.0f64; w * h];
    <b>let mut</b> frame = Frame::blank(w, h);

    <b>let</b> (a, b) = (t * 1.0, t * 0.5);
    <b>let</b> (cos_a, sin_a) = (a.cos(), a.sin());
    <b>let</b> (cos_b, sin_b) = (b.cos(), b.sin());

    <b>let</b> r1 = 1.0;
    <b>let</b> r2 = 2.0;
    <b>let</b> k2 = 5.0;</code></pre>
        </div>
        <div class="window terminal">
          <div class="titlebar"><i></i><i></i><i></i><span>zsh</span></div>
          <pre><code>~/ascii-arcade % aa scenes
donut
helix
matrix
life
pipes
~/ascii-arcade % aa themes
hacker
amber
ice
ghost</code></pre>
        </div>
        <ul class="menu">
          <li class="hl"></li>
          <li class="head">Scene</li>
          <li>Donut</li>
          <li>Helix</li>
          <li>Matrix<i class="check check-matrix">✓</i></li>
          <li>Life<i class="check check-life">✓</i></li>
          <li>Pipes</li>
          <li class="rule"></li>
          <li>Next Scene&nbsp; (⌘⌥C)</li>
          <li>Enable DOOM Scene</li>
          <li>Scene Settings<i class="more">›</i></li>
          <li>Auto-cycle when idle<i class="check">✓</i></li>
          <li>Launch at Login</li>
          <li>Opaque Background</li>
          <li class="rule"></li>
          <li class="head">Capture</li>
          <li>Save Screenshot&nbsp; (⌘⌥S)</li>
          <li>Record 3-Sec Clip&nbsp; (⌘⌥E)</li>
          <li class="rule"></li>
          <li class="head">Theme</li>
          <li>Hacker<i class="check">✓</i></li>
          <li>Amber</li>
          <li>Ice</li>
          <li>Ghost</li>
          <li class="rule"></li>
          <li>Quit</li>
        </ul>
        <svg class="cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2 L3 19 L7.5 14.8 L10.4 21.5 L13.4 20.2 L10.6 13.7 L16.8 13.7 Z" /></svg>
      </div>

      <script>
        // Local time: 0 is 7.01 s in the trailer. The wall under this
        // dissolves from Matrix to Life at 3.1 s, just after the click.
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const ROW = 32;
        const scope = document.querySelector('[data-composition-id="desk"]');
        const $ = (s) => scope.querySelector(s);
        tl.fromTo($(".editor"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.14)
          .fromTo($(".terminal"), { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.34)
          .to($(".editor"), { y: -14, duration: 5.9, ease: "sine.inOut" }, 0.84)
          .to($(".terminal"), { y: -10, duration: 5.7, ease: "sine.inOut" }, 1.04)
          .set($(".cursor"), { x: 1380, y: 640 }, 1.19)
          .to($(".cursor"), { opacity: 1, duration: 0.15, ease: "none" }, 1.19)
          .to($(".cursor"), { x: 1694, y: 10, duration: 0.6, ease: "power2.inOut" }, 1.24)
          .fromTo($(".menu"), { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.12, ease: "power1.out" }, 1.89)
          .to($(".cursor"), { x: 1640, y: 186, duration: 0.85, ease: "power1.inOut" }, 2.04)
          .set($(".hl"), { opacity: 1, y: ROW }, 2.19)
          .set($(".hl"), { y: ROW * 2 }, 2.39)
          .set($(".hl"), { y: ROW * 3 }, 2.59)
          .set($(".hl"), { y: ROW * 4 }, 2.79)
          .set($(".hl"), { opacity: 0 }, 2.99)
          .set($(".hl"), { opacity: 1 }, 3.04)
          .set($(".check-matrix"), { opacity: 0 }, 3.04)
          .set($(".check-life"), { opacity: 1 }, 3.04)
          .to($(".menu"), { opacity: 0, duration: 0.15, ease: "none" }, 3.11)
          .to($(".cursor"), { x: 1300, y: 520, duration: 1.2, ease: "power2.inOut" }, 3.59)
          .to($(".cursor"), { opacity: 0, duration: 0.3, ease: "none" }, 4.59);
        window.__timelines["desk"] = tl;
      </script>
    </template>
  </body>
</html>
