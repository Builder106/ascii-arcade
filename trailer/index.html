<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Arcade trailer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The site's type: Pixelify Sans for display, Handjet for body, Plex
         Mono for code. Declared here so every scene can use them. */
      @font-face {
        font-family: "Pixelify Sans";
        src: url("public/fonts/PixelifySans-400-700.woff2") format("woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Handjet";
        src: url("public/fonts/Handjet-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("public/fonts/IBMPlexMono-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("public/fonts/IBMPlexMono-600.woff2") format("woff2");
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #030805;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .ground {
        position: absolute;
        inset: 0;
        background: #030805;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      /* Pushes the site's strip and header out of frame behind the end card. */
      #coin-door {
        transform: scale(1.15);
        transform-origin: 70% 30%;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #desk { z-index: 2; }
      #montage { z-index: 3; }
      #end { z-index: 4; }
      #captions { z-index: 5; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="AsciiArcadeTrailer"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-start="0"
      data-duration="39.5"
    >
      <div class="ground"></div>

      <!-- Footage of the real site. Cuts after 3.0 s sit on Pixelland's beats. -->
      <video id="power" src="public/clips/power.mp4" data-start="0" data-duration="7.01" data-track-index="0" muted playsinline></video>
      <video id="desk-wall" src="public/clips/desk.mp4" data-start="7.01" data-duration="6.78" data-track-index="0" muted playsinline></video>
      <video id="m1" src="public/clips/m1.mp4" data-start="13.79" data-duration="1.05" data-track-index="0" muted playsinline></video>
      <video id="m2" src="public/clips/m2.mp4" data-start="14.84" data-duration="1.04" data-track-index="0" muted playsinline></video>
      <video id="m3" src="public/clips/m3.mp4" data-start="15.88" data-duration="1.05" data-track-index="0" muted playsinline></video>
      <video id="m4" src="public/clips/m4.mp4" data-start="16.93" data-duration="1.02" data-track-index="0" muted playsinline></video>
      <video id="m5" src="public/clips/m5.mp4" data-start="17.95" data-duration="1.05" data-track-index="0" muted playsinline></video>
      <video id="m6" src="public/clips/m6.mp4" data-start="19" data-duration="1.04" data-track-index="0" muted playsinline></video>
      <video id="doom-in" src="public/clips/doom-in.mp4" data-start="20.04" data-duration="1.58" data-track-index="0" muted playsinline></video>
      <video id="doom-play" src="public/clips/doom-play.mp4" data-start="21.62" data-duration="5.74" data-track-index="0" muted playsinline></video>
      <video id="snap" src="public/clips/snap.mp4" data-start="27.36" data-duration="6.26" data-track-index="0" muted playsinline></video>
      <video id="coin-door" src="public/clips/coin.mp4" data-start="33.62" data-duration="5.88" data-track-index="0" muted playsinline></video>

      <!-- The Mac desktop over the wallpaper, the montage labels, the end card, and the captions. -->
      <div id="desk" data-composition-id="desk" data-composition-src="compositions/desk.html" data-start="7.01" data-duration="6.78" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="13.79" data-duration="6.25" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="7.01" data-duration="26.61" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="33.62" data-duration="5.88" data-track-index="4" data-width="1920" data-height="1080"></div>

      <audio id="music" src="public/audio.mp3" data-start="2.51" data-duration="36.99" data-track-index="20"></audio>
      <audio id="sfx-power" src="public/sfx_power.wav" data-start="0.05" data-duration="0.9" data-track-index="21" data-volume="0.6"></audio>
      <audio id="sfx-pull" src="public/sfx_whoosh.wav" data-start="3" data-duration="0.6" data-track-index="22" data-volume="0.35"></audio>
      <audio id="sfx-open" src="public/sfx_blip.wav" data-start="8.9" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfx-pick" src="public/sfx_blip.wav" data-start="10" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfx-glass" src="public/sfx_whoosh.wav" data-start="20.42" data-duration="0.6" data-track-index="22" data-volume="0.35"></audio>
      <audio id="sfx-snap" src="public/sfx_whoosh.wav" data-start="31.53" data-duration="0.6" data-track-index="22" data-volume="0.35"></audio>
      <audio id="sfx-coin" src="public/sfx_coin.wav" data-start="35.2" data-duration="0.55" data-track-index="21" data-volume="0.6"></audio>
    </div>
    <script>
      // Pixelland starts at 2.51 s, so its first beat lands at 3.0 s, where
      // the boot log dissolves into the cabinet. It fades over the last beats.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#music", { volume: 1 }, { volume: 0, duration: 1.4, ease: "none" }, 38.0);
      window.__timelines.AsciiArcadeTrailer = tl;
    </script>
  </body>
</html>
