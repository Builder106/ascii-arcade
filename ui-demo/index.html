<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII Arcade UI demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The site's type, declared here so every scene can use it. */
      @font-face {
        font-family: "Pixelify Sans";
        src: url("public/fonts/PixelifySans-400-700.woff2") format("woff2");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Handjet";
        src: url("public/fonts/Handjet-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("public/fonts/IBMPlexMono-400.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #030805;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .ground {
        position: absolute;
        inset: 0;
        background: #030805;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #desktop { z-index: 2; }
      #captions { z-index: 3; }
      #end { z-index: 4; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="AsciiArcadeUiDemo"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-start="0"
      data-duration="41"
    >
      <div class="ground"></div>

      <!-- The macOS app's wallpaper window, recorded on its own. Each shot opens 1.3 s before a menu click. -->
      <video id="donut" src="public/clips/donut.mp4" data-start="0" data-duration="7.5" data-track-index="0" muted playsinline></video>
      <video id="matrix" src="public/clips/matrix.mp4" data-start="7.5" data-duration="3.74" data-track-index="0" muted playsinline></video>
      <video id="life" src="public/clips/life.mp4" data-start="11.24" data-duration="3.67" data-track-index="0" muted playsinline></video>
      <video id="pipes" src="public/clips/pipes.mp4" data-start="14.91" data-duration="4.41" data-track-index="0" muted playsinline></video>
      <video id="amber" src="public/clips/amber.mp4" data-start="19.32" data-duration="3.3" data-track-index="0" muted playsinline></video>
      <video id="ice" src="public/clips/ice.mp4" data-start="22.62" data-duration="3.32" data-track-index="0" muted playsinline></video>
      <video id="ghost" src="public/clips/ghost.mp4" data-start="25.94" data-duration="3.29" data-track-index="0" muted playsinline></video>
      <video id="doom-in" src="public/clips/doom-in.mp4" data-start="29.23" data-duration="2.49" data-track-index="0" muted playsinline></video>
      <video id="doom-play" src="public/clips/doom-play.mp4" data-start="31.72" data-duration="5.36" data-track-index="0" muted playsinline></video>

      <div id="desktop" data-composition-id="desktop" data-composition-src="compositions/desktop.html" data-start="0" data-duration="37.08" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="37.08" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="37.08" data-duration="3.92" data-track-index="2" data-width="1920" data-height="1080"></div>

      <audio id="music" src="public/audio.mp3" data-start="0" data-duration="41" data-track-index="20"></audio>
      <audio id="blip-helix" src="public/sfx_blip.wav" data-start="4.4" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-matrix" src="public/sfx_blip.wav" data-start="8.8" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-life" src="public/sfx_blip.wav" data-start="12.54" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-pipes" src="public/sfx_blip.wav" data-start="16.21" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-amber" src="public/sfx_blip.wav" data-start="20.62" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-ice" src="public/sfx_blip.wav" data-start="23.92" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-ghost" src="public/sfx_blip.wav" data-start="27.24" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="blip-doom" src="public/sfx_blip.wav" data-start="30.53" data-duration="0.12" data-track-index="21" data-volume="0.5"></audio>
      <audio id="sfx-coin" src="public/sfx_coin.wav" data-start="38" data-duration="0.55" data-track-index="22" data-volume="0.6"></audio>
    </div>
    <script>
      // "Pixel Peeker Polka - faster" from its start, fading over the end card.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#music", { volume: 1 }, { volume: 0, duration: 1.5, ease: "none" }, 39.5);
      window.__timelines.AsciiArcadeUiDemo = tl;
    </script>
  </body>
</html>
